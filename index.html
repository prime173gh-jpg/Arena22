<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساحة المعركة - Anime Edition Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#090c26">
<style>
:root{--bg:#090c26;--ink:#eaf2ff;--line:#2a3478;color-scheme:dark;box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%}
#pad{position:absolute;left:0;top:25%;width:45%;bottom:0}
#btns{position:absolute;right:8px;bottom:12px;display:grid;grid-template-columns:repeat(3,60px);gap:7px;direction:ltr;z-index:5}
.b{height:60px;border-radius:50%;border:2px solid var(--line);background:#141a45;color:var(--ink);font:600 11px system-ui;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0;touch-action:none}
.b:active{background:#222c7a}
.b.m1{border-color:#ff7b7b;background:#26142e}
.b.w{border-radius:30px;border-color:#4fc3ff}
.b.rdy{border-color:#ffd166;box-shadow:0 0 14px #ffd166}
.b i{position:absolute;inset:0;background:rgba(5,8,30,.75);transform-origin:bottom;transform:scaleY(0)}
.b span{position:relative}
#ov{position:absolute;inset:0;background:rgba(6,9,30,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:10}
#ov h1{margin:0;font-size:28px;color:#4fc3ff}
#ov p{margin:0;max-width:330px;line-height:1.6;color:#b9c6ff;font-size:14px}
@media (orientation:landscape) and (max-height:540px){#btns{grid-template-columns:repeat(3,52px);gap:5px;bottom:8px;right:8px}.b{height:52px;font-size:10px}.b.w{border-radius:26px}#pad{top:12%;width:40%}#ov h1{font-size:22px}#ov{gap:8px;padding:12px}#bx button{padding:9px 24px;font-size:15px}}
#ov textarea{width:min(88vw,330px);height:120px;direction:ltr;background:#141a45;color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:12px;padding:8px;user-select:text;-webkit-user-select:text}
#ov{touch-action:auto}
#bx{display:flex;flex-direction:column;gap:9px;align-items:center}
#bx button{font:600 17px system-ui;padding:12px 26px;border-radius:26px;border:0;background:#4fc3ff;color:#04122a;min-width:220px;cursor:pointer}
#bx button.s{background:#1b2260;color:var(--ink);font-size:14px;padding:9px 20px}
.diff-row{display:flex;gap:8px;margin-bottom:4px}
.diff-btn{padding:7px 14px!important;min-width:auto!important;font-size:13px!important;border-radius:14px!important;background:#1b2260!important;color:#fff!important;border:2px solid transparent!important}
.diff-btn.active{border-color:#ffd166!important;background:#2a358c!important;color:#ffd166!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad"></div>
<div id="btns"></div>
<div id="ov"><h1 id="t"></h1><p id="m"></p><div id="df"></div><textarea id="ta" style="display:none"></textarea><div id="bx"></div></div>
<script>
/* ===== الشخصيات والمهارات الأنمي الاحترافية ===== */
const CH={
 gojo:{n:'جوجو',style:'gojo',hp:1500,col:'#4fc3ff',sp:190,rng:230,
  sk:[{n:'أزرق',t:'pull',cd:7,dur:1.6,tick:.125,dmg:18},
      {n:'أحمر',t:'orb',cd:5,dmg:65,ex:85,v:350,bn:1,col:'#ff5a6a',u:{dmg:140,ex:180}},
      {n:'بنفسجي',t:'beam',cd:10,dmg:280,w:50,need:1,col:'#b86bff'}],
  dom:{n:'الفراغ اللانهائي',type:'freeze',tick:.5,dmg:30,dur:7}},
 suk:{n:'سوكونا',style:'sukuna',hp:1500,col:'#ff4d5e',sp:185,rng:115,
  sk:[{n:'تفكيك',t:'slash',cd:2.5,dmg:32,cnt:3,v:620},
      {n:'تقطيع',t:'cleave',cd:4,dmg:75,r:90},
      {n:'سهم النار',t:'orb',cd:7,dmg:95,ex:95,v:410,bn:0,col:'#ff9a3c',u:{dmg:190,ex:175}}],
  dom:{n:'المزار الشرير',type:'shrine',tick:.25,dmg:28,dur:7}},
 kashimo:{n:'كاشيمو',style:'kashimo',hp:1450,col:'#3b82f6',sp:200,rng:160,
  sk:[{n:'صاعقة برق',t:'slash',cd:2.3,dmg:38,cnt:4,v:680,col:'#60a5fa'},
      {n:'صدمة رعدية',t:'cleave',cd:3.8,dmg:85,r:95},
      {n:'برق متسلسل',t:'orb',cd:6.5,dmg:95,ex:95,v:430,bn:1,col:'#9333ea',u:{dmg:190,ex:185}}],
  dom:{n:'حقل التفريغ',type:'lightning',tick:.25,dmg:32,dur:7}},
 naoya:{n:'ناويا',style:'naoya',hp:1400,col:'#10b981',sp:215,rng:140,
  sk:[{n:'إسقاط زمني',t:'dash_strike',cd:3,dmg:40,v:750},
      {n:'تجميد إطارات',t:'freeze_frame',cd:5,dmg:70,r:100},
      {n:'سرعة الصوت',t:'orb',cd:7,dmg:90,ex:90,v:450,bn:0,col:'#34d399'}],
  dom:{n:'مملكة الإطارات',type:'projection',tick:.3,dmg:28,dur:7}},
 hakari:{n:'هاكاري',style:'hakari',hp:1600,col:'#f59e0b',sp:185,rng:110,
  sk:[{n:'لكمات متتالية',t:'slash',cd:2.2,dmg:35,cnt:3,v:600,col:'#fbbf24'},
      {n:'ضربة الحظ',t:'cleave',cd:4,dmg:80,r:85},
      {n:'طاقة الـ Jackpot',t:'orb',cd:7.5,dmg:100,ex:100,v:380,bn:0,col:'#fbbf24'}],
  dom:{n:'سرايا المقامرة',type:'jackpot',tick:.3,dmg:26,dur:7}},
 toji:{n:'توجي',style:'toji',hp:1550,col:'#64748b',sp:210,rng:120,
  sk:[{n:'سلسلة الموت',t:'slash',cd:2,dmg:40,cnt:3,v:700,col:'#94a3b8'},
      {n:'طعنة سماوية',t:'cleave',cd:3.5,dmg:90,r:90},
      {n:'هجوم مباغت',t:'orb',cd:6,dmg:95,ex:90,v:420,bn:0,col:'#cbd5e1'}],
  dom:{n:'ساحة الجسد السماوي',type:'heavenly',tick:.25,dmg:34,dur:7}}
};

const DOMCH=200,ULTCH=300,ULT=10,CLASH=30,CAST=2.2,A=300;
const TY=['pull','orb','beam','slash','cleave','dash_strike','freeze_frame'],DF={pull:{dur:1.5,tick:.125,dmg:15},orb:{v:320,ex:85,bn:0,col:'#ff9a3c'},beam:{w:45,col:'#b86bff'},slash:{cnt:3,v:580},cleave:{r:85},dash_strike:{v:700},freeze_frame:{r:90}};

function fix(c){try{if(!c||!c.id||!c.n||!(c.hp>0)||!Array.isArray(c.sk)||c.sk.length!==3)return null;
  c.sp=c.sp||180;c.rng=c.rng||150;c.col=c.col||'#ffffff';c.style=c.style||'default';c.dom=Object.assign({n:'مجال',type:'shrine',tick:.5,dmg:30,dur:7},c.dom);
  c.sk=c.sk.map(s=>{if(!TY.includes(s.t))throw 0;return Object.assign({n:s.t,cd:5,dmg:40},DF[s.t],s)});return c}catch(e){return null}}
try{const cc=JSON.parse(localStorage.getItem('cc')||'{}');for(const k in cc){const c=fix(JSON.parse(JSON.stringify(cc[k])));if(c)CH[k]=c}}catch(e){}

const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),BT=document.getElementById('btns');
let W,H,S,cx,cy,dpr,G=null,CK='gojo',DIFF=0.25,keys={},M={v:[0,0],near:220,dodge:.3,lvl:.25,n:0,w:{}};
try{M=Object.assign(M,JSON.parse(localStorage.getItem('bm')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bm',JSON.stringify(M))}catch(e){}};
const joy={on:false,id:null,ox:0,oy:0,x:0,y:0},B={};

const STARS=Array.from({length:45},()=>({a:Math.random()*6.28,r:Math.random()*280,s:1+Math.random()*2.5}));

function rs(){dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;if(W>H){S=Math.min(W*.45,H*.86)/(A*2+30);cx=W/2;cy=H*.55}else{S=Math.min(W,H*.68)/(A*2+50);cx=W/2;cy=H*.38}}
addEventListener('resize',rs);

function ui(t,m,btns,ta,showDiff=false){
  ov.style.display='flex';
  document.getElementById('t').textContent=t;
  document.getElementById('m').innerHTML=m||'';
  const df=document.getElementById('df');
  df.innerHTML='';
  if(showDiff){
    const row=document.createElement('div');row.className='diff-row';
    [['سهل',0.2],['متوسط',0.45],['صعب',0.85]].forEach(([lbl,val])=>{
      const b=document.createElement('button');
      b.className='diff-btn'+(DIFF===val?' active':'');
      b.textContent='مستوى: '+lbl;
      b.onclick=()=>{DIFF=val;M.lvl=val;save();ui(t,m,btns,ta,true)};
      row.append(b);
    });
    df.append(row);
  }
  const TA=document.getElementById('ta');TA.style.display=ta===undefined?'none':'block';if(ta!==undefined)TA.value=ta;
  const bx=document.getElementById('bx');bx.innerHTML='';
  btns.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;if(c)b.className=c;b.onclick=f;bx.append(b)})
}

function menu(){G=null;ui('ساحة القتال - Anime Pro Edition','اختر شخصيتك وانطلق في معركة الأنمي الأسطورية!',
  Object.keys(CH).map(k=>['العب بـ '+CH[k].n,()=>start(k)]).concat([['شخصياتي: إضافة وتعديل',editor,'s']]),undefined,true)}

const TPL={id:'custom_ch',n:'شخصية جديدة',style:'default',hp:1400,col:'#4fff91',sp:190,rng:150,sk:[{n:'مهارة 1',t:'slash',cd:2.5,dmg:35,cnt:3,v:600},{n:'مهارة 2',t:'cleave',cd:4,dmg:80,r:90},{n:'مهارة 3',t:'orb',cd:7,dmg:90,ex:95,v:390}],dom:{n:'مجال خاص',type:'shrine',tick:.3,dmg:30,dur:7}};
const ta=()=>document.getElementById('ta');

function editor(){let cc={};try{cc=JSON.parse(localStorage.getItem('cc')||'{}')}catch(e){}
  ui('شخصياتي','الصق كود الشخصية واضغط حفظ. المحفوظ: '+(Object.keys(cc).join('، ')||'لا شيء'),
  [['حفظ',()=>{try{const j=JSON.parse(ta().value),L=j.id?[j]:Object.values(j);let n=0;
      L.forEach(x=>{const c=fix(JSON.parse(JSON.stringify(x)));if(c){cc[c.id]=x;CH[c.id]=c;n++}});if(!n)throw 0;
      localStorage.setItem('cc',JSON.stringify(cc));editor()}catch(e){document.getElementById('m').textContent='الكود فيه غلط، جرب القالب الجاهز.'}}],
   ['قالب جاهز',()=>ta().value=JSON.stringify(TPL,null,1),'s'],
   ['تصدير المحفوظ',()=>ta().value=JSON.stringify(cc),'s'],
   ['حذف: اكتب الـ id',()=>{const k=ta().value.trim();if(cc[k]){delete cc[k];delete CH[k];localStorage.setItem('cc',JSON.stringify(cc))}editor()},'s'],
   ['رجوع',menu,'s']],'')}

function mkE(k,x,face){return{k,x,y:0,hp:CH[k].hp,max:CH[k].hp,r:22,dash:0,dcd:0,dx:0,dy:0,stun:0,kx:0,ky:0,cd:[0,0,0],rcd:0,bl:0,ba:0,blcd:0,perf:0,dm:0,pur:0,blue:0,tk:0,bs:null,dom:0,dage:0,dtk:0,lr:-9,dc:0,ult:0,ut:0,d:[0,0],m1cd:0,cmb:0,cmbt:0,face:face,walk:0,punch:0}}

function start(k){CK=k;const ks=Object.keys(CH).filter(x=>x!==k),ok=ks[Math.floor(Math.random()*ks.length)];
  M.w[ok]=M.w[ok]||[1,1,1];
  G={p:[mkE(k,-160,1),mkE(ok,160,-1)],s:[],fx:[],pops:[],t:0,st:'play',clash:null,bc:-9,lx:-160,ly:0,msg:'',mt:0,shk:0,flash:0,flashCol:'#fff'};
  Object.assign(B,{rt:0});
  BT.innerHTML='';const c=CH[k];
  [[0,c.sk[0].n],[1,c.sk[1].n],[2,c.sk[2].n],['m1','ضرب'],['bl','بلوك'],['rct','علاج'],['dom','مجال'],['ult','ألتميت'],['dash','داش']].forEach(([id,n])=>{
    const b=document.createElement('button');
    b.className='b'+(id==='dash'?' w':'')+(id==='m1'?' m1':'');
    b.id='b'+id;b.innerHTML='<i></i><span>'+n+'</span>';
    b.addEventListener('pointerdown',e=>{e.preventDefault();use(0,id)});BT.append(b)});
  ov.style.display='none';try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}

function pop(e,txt,c){G.pops.push({x:e.x,y:e.y-42,txt,c:c||'#fff',t:.9})}
function ring(x,y,c,r){G.fx.push({k:'r',x,y,t:0,c,r})}
function slashFx(x,y,c,cnt=4,sz=45){G.fx.push({k:'sl',x,y,t:0,c,cnt,sz,ang:Math.random()*3.14})}
function lightningFx(x,y){G.fx.push({k:'lt',x,y,t:0})}

function dmgTo(i,d,sure){const t=G.p[i],s=G.p[1-i];
  if(!sure){if(t.dash>0){pop(t,'تفادي','#9fffe0');return 0}
    if(t.bl>0){if(t.ba<.25){t.perf++;pop(t,'بلوك مثالي +'+(t.perf*10)+'%','#ffd166');return 0}d*=.3}}
  d=Math.round(d*(1+.1*s.perf));t.hp=Math.max(0,t.hp-d);
  if(!G.clash&&!(s.dom>0))s.dm=Math.min(DOMCH,s.dm+d);
  if(!(s.ult>0))s.ut=Math.min(ULTCH,s.ut+d);
  if(!(t.ult>0))t.ut=Math.min(ULTCH,t.ut+d*.4);
  if(G.clash)G.clash.dmg[1-i]+=d;
  pop(t,'-'+d);return d}

function usk(e,k){const b=CH[e.k].sk[k],o=Object.assign({},b);
  if(e.ult>0){if(b.u)Object.assign(o,b.u);else{o.dmg=b.dmg*2;if(b.ex)o.ex=b.ex*1.8;if(b.r)o.r=b.r*1.6;if(b.w)o.w=b.w*1.8;if(b.cnt)o.cnt=b.cnt+2;if(b.dur)o.dur=b.dur*1.5}}return o}

function learn(i,k,ok){if(i!==1)return;const w=M.w[G.p[1].k];w[k]=Math.max(.3,Math.min(3,w[k]+(ok?.2:-.1)))}
function lineDist(x1,y1,x2,y2,px,py){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let u=((px-x1)*dx+(py-y1)*dy)/l;u=Math.max(0,Math.min(1,u));return Math.hypot(px-x1-u*dx,py-y1-u*dy)}
function boom(s){const t=G.p[1-s.o];ring(s.x,s.y,s.col,s.ex);G.shk=.22;let h=false;if(Math.hypot(t.x-s.x,t.y-s.y)<s.ex+t.r){h=dmgTo(1-s.o,s.dmg)>0}learn(s.o,s.k,h)}

function use(i,k,tx,ty){if(!G||G.st!=='play')return;const e=G.p[i],t=G.p[1-i],c=CH[e.k];if(e.stun>0||e.dc>0)return;
  const ax=tx===undefined?t.x:tx,ay=ty===undefined?t.y:ty;
  if(ax!==e.x)e.face=ax>e.x?1:-1;
  
  if(k==='m1'){if(e.m1cd>0)return;
    e.m1cd=.32;e.punch=.22;
    if(e.cmbt<=0)e.cmb=0;
    e.cmb++;e.cmbt=1.3;
    const isFinisher=(e.cmb>=3);
    if(isFinisher)e.cmb=0;
    const a=Math.atan2(ay-e.y,ax-e.x);
    e.x+=Math.cos(a)*18;e.y+=Math.sin(a)*18;
    const dist=Math.hypot(t.x-e.x,t.y-e.y);
    const rng=isFinisher?76:62;
    ring(e.x+Math.cos(a)*28,e.y+Math.sin(a)*28,isFinisher?'#ffd166':c.col,isFinisher?50:32);
    if(dist<rng+t.r){
      const dmg=isFinisher?55:25;
      if(dmgTo(1-i,dmg)>0){
        if(isFinisher){
          t.kx+=Math.cos(a)*500;t.ky+=Math.sin(a)*500;
          t.stun=.4;G.shk=.18;
          pop(t,'ضربة قاضية سينمائية!','#ffd166');
          e.lr=G.t;
        }else{
          t.kx+=Math.cos(a)*120;t.ky+=Math.sin(a)*120;
        }
      }
    }
    return}

  if(k==='dash'){if(e.dcd>0||e.dash>0)return;let[x,y]=e.d,l=Math.hypot(x,y);if(!l){x=ax-e.x;y=ay-e.y;l=Math.hypot(x,y)||1}
    e.dash=.18;e.dcd=1.1;e.dx=x/l;e.dy=y/l;if(i===0&&G.t-G.bc<.8)M.dodge=M.dodge*.85+.15;return}
  if(k==='bl'){if(e.blcd>0||e.bl>0)return;e.bl=.6;e.ba=0;e.blcd=1.2;if(i===0&&G.t-G.bc<.8)M.dodge=M.dodge*.85+.15;return}
  if(k==='rct'){if(e.rcd>0||e.hp>=e.max)return;e.rcd=18;e.hp=Math.min(e.max,e.hp+250);pop(e,'+250','#7dffa0');ring(e.x,e.y,'#7dffa0',45);return}
  if(k==='dom'){if(e.dm<DOMCH||e.dom>0||G.clash)return;e.dm=0;e.dc=CAST;
    G.flash=.4;G.flashCol=c.col;G.shk=.35;
    ring(e.x,e.y,c.col,300);
    G.msg='⚡ '+c.n+': توسع المجال الأسطوري!';G.mt=2.5;
    if(t.dc>0||(t.dom>0&&t.dage<1.5)){t.dom=0;G.clash={t:CLASH,dmg:[0,0]};G.msg='تصادم مجالات أنمي!';G.mt=2.8;G.shk=.45}return}
  if(k==='ult'){if(e.ut<ULTCH||e.ult>0)return;e.ut=0;e.ult=ULT;ring(e.x,e.y,'#ffd166',240);G.msg=c.n+': طاقة القدرة القصوى!';G.mt=2.2;G.shk=.3;return}
  
  const s=usk(e,k);if(e.cd[k]>0||(s.need&&e.pur<=0))return;e.cd[k]=s.cd;if(i===1)G.bc=G.t;
  const a=Math.atan2(ay-e.y,ax-e.x);

  if(s.t==='dash_strike'){
    e.x+=Math.cos(a)*180; e.y+=Math.sin(a)*180;
    ring(e.x,e.y,c.col,90);
    G.shk=.2;
    dmgTo(1-i,s.dmg);
    return;
  }
  if(s.t==='freeze_frame'){
    ring(e.x,e.y,c.col,s.r);
    t.stun=Math.max(t.stun, 1.2);
    dmgTo(1-i,s.dmg);
    pop(t,'تجميد إطارات!','#34d399');
    return;
  }

  if(s.t==='pull'){e.blue=s.dur;e.tk=0;e.bs=s;e.lb=G.t;ring(e.x,e.y,'#4fc3ff',e.ult>0?260:160);if(G.t-e.lr<2.5)e.pur=4}
  if(s.t==='orb'){
    const col=s.col||c.col;
    G.s.push({o:i,k,x:e.x,y:e.y,vx:Math.cos(a)*s.v,vy:Math.sin(a)*s.v,dmg:s.dmg,ex:s.ex,bn:s.bn,col:col,life:3,big:1,sz:s.ex*.16});
    e.lr=G.t;if(e.blue>0)e.pur=4;
  }
  if(s.t==='slash'){
    const col=s.col||c.col;
    for(let n=0;n<s.cnt;n++){
      const q=a+(n-(s.cnt-1)/2)*.14;
      G.s.push({o:i,k,x:e.x,y:e.y,vx:Math.cos(q)*s.v,vy:Math.sin(q)*s.v,dmg:s.dmg,col:col,life:.85,big:0,blade:1,ang:q,hit:n?1:0});
    }
  }
  if(s.t==='cleave'){
    const d=Math.hypot(t.x-e.x,t.y-e.y);
    ring(e.x,e.y,c.col,s.r);
    slashFx(t.x,t.y,c.col,6,60);
    if(c.style==='kashimo'||c.style==='toji') lightningFx(t.x, t.y);
    G.shk=.2;
    learn(i,k,d<s.r+t.r&&dmgTo(1-i,s.dmg+(1-t.hp/t.max)*90)>0);
  }

function bot(dt){const e=G.p[1],p=G.p[0],c=CH[e.k],w=M.w[e.k],L=DIFF;
