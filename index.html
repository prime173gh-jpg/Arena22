<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساحة المعركة - Ultimate Anime 2D</title>
<style>
:root{--bg:#090c26;--ink:#eaf2ff;--line:#2a3478;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%}
#pad{position:absolute;left:0;top:25%;width:45%;bottom:0}
#btns{position:absolute;right:8px;bottom:12px;display:grid;grid-template-columns:repeat(3,60px);gap:7px;direction:ltr}
.b{height:60px;border-radius:50%;border:2px solid var(--line);background:#141a45;color:var(--ink);font:600 11px system-ui;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0}
.b:active{background:#222c7a}
.b.m1{border-color:#ff7b7b;background:#26142e}
.b.w{border-radius:30px;border-color:#4fc3ff}
.b.rdy{border-color:#ffd166;box-shadow:0 0 14px #ffd166}
.b i{position:absolute;inset:0;background:rgba(5,8,30,.75);transform-origin:bottom;transform:scaleY(0)}
.b span{position:relative}
#ov{position:absolute;inset:0;background:rgba(6,9,30,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:10}
#ov h1{margin:0;font-size:26px;color:#4fc3ff}
#ov p{margin:0;max-width:330px;line-height:1.6;color:#b9c6ff;font-size:14px}
#bx{display:flex;flex-direction:column;gap:9px;align-items:center}
#bx button{font:600 16px system-ui;padding:12px 26px;border-radius:26px;border:0;background:#4fc3ff;color:#04122a;min-width:220px;cursor:pointer}
#bx button.s{background:#1b2260;color:var(--ink);font-size:14px;padding:9px 20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad"></div>
<div id="btns"></div>
<div id="ov"><h1 id="t"></h1><p id="m"></p><div id="bx"></div></div>
<script>
const CH={
 gojo:{n:'جوجو',style:'gojo',hp:1500,col:'#4fc3ff',sp:190,rng:230,sk:[{n:'أزرق',t:'pull',cd:7,dur:1.6,tick:.125,dmg:18},{n:'أحمر',t:'orb',cd:5,dmg:65,ex:85,v:350,bn:1,col:'#ff5a6a'},{n:'بنفسجي',t:'beam',cd:10,dmg:280,w:50,need:1,col:'#b86bff'}],dom:{n:'الفراغ اللانهائي',type:'freeze',tick:.5,dmg:30,dur:7}},
 suk:{n:'سوكونا',style:'sukuna',hp:1500,col:'#ff4d5e',sp:185,rng:115,sk:[{n:'تفكيك',t:'slash',cd:2.5,dmg:32,cnt:3,v:620},{n:'تقطيع',t:'cleave',cd:4,dmg:75,r:90},{n:'سهم النار',t:'orb',cd:7,dmg:95,ex:95,v:410,bn:0,col:'#ff9a3c'}],dom:{n:'المزار الشرير',type:'shrine',tick:.25,dmg:28,dur:7}},
 kashimo:{n:'كاشيمو',style:'kashimo',hp:1450,col:'#3b82f6',sp:200,rng:160,sk:[{n:'صاعقة برق',t:'slash',cd:2.3,dmg:38,cnt:4,v:680,col:'#60a5fa'},{n:'صدمة رعدية',t:'cleave',cd:3.8,dmg:85,r:95},{n:'برق متسلسل',t:'orb',cd:6.5,dmg:95,ex:95,v:430,bn:1,col:'#9333ea'}],dom:{n:'حقل التفريغ',type:'lightning',tick:.25,dmg:32,dur:7}},
 naoya:{n:'ناويا',style:'naoya',hp:1400,col:'#10b981',sp:215,rng:140,sk:[{n:'إسقاط زمني',t:'dash_strike',cd:3,dmg:40,v:750},{n:'تجميد إطارات',t:'freeze_frame',cd:5,dmg:70,r:100},{n:'سرعة الصوت',t:'orb',cd:7,dmg:90,ex:90,v:450,bn:0,col:'#34d399'}],dom:{n:'مملكة الإطارات',type:'projection',tick:.3,dmg:28,dur:7}},
 hakari:{n:'هاكاري',style:'hakari',hp:1600,col:'#f59e0b',sp:185,rng:110,sk:[{n:'لكمات متتالية',t:'slash',cd:2.2,dmg:35,cnt:3,v:600,col:'#fbbf24'},{n:'ضربة الحظ',t:'cleave',cd:4,dmg:80,r:85},{n:'طاقة الـ Jackpot',t:'orb',cd:7.5,dmg:100,ex:100,v:380,bn:0,col:'#fbbf24'}],dom:{n:'سرايا المقامرة',type:'jackpot',tick:.3,dmg:26,dur:7}},
 toji:{n:'توجي',style:'toji',hp:1550,col:'#64748b',sp:210,rng:120,sk:[{n:'سلسلة الموت',t:'slash',cd:2,dmg:40,cnt:3,v:700,col:'#94a3b8'},{n:'طعنة سماوية',t:'cleave',cd:3.5,dmg:90,r:90},{n:'هجوم مباغت',t:'orb',cd:6,dmg:95,ex:90,v:420,bn:0,col:'#cbd5e1'}],dom:{n:'ساحة الجسد السماوي',type:'heavenly',tick:.25,dmg:34,dur:7}}
};

const DOMCH=200,ULTCH=300,ULT=10,CLASH=30,CAST=2.2,A=300;
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),BT=document.getElementById('btns');
let W,H,S,cx,cy,dpr,G=null,CK='gojo',keys={},joy={on:false,id:null,ox:0,oy:0,x:0,y:0};

function rs(){dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;S=Math.min(W*.45,H*.86)/(A*2+30);cx=W/2;cy=H*.55}
addEventListener('resize',rs);

function ui(t,m,btns){
  ov.style.display='flex';
  document.getElementById('t').textContent=t;
  document.getElementById('m').innerHTML=m||'';
  const bx=document.getElementById('bx');bx.innerHTML='';
  btns.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;if(c)b.className=c;b.onclick=f;bx.append(b)});
}

function menu(){G=null;ui('ساحة القتال - Anime Edition','اختر شخصيتك وابدأ المعركة السينمائية!',Object.keys(CH).map(k=>['العب بـ '+CH[k].n,()=>start(k)]))}

function mkE(k,x,face){return{k,x,y:0,hp:CH[k].hp,max:CH[k].hp,r:22,dash:0,dcd:0,dx:0,dy:0,stun:0,kx:0,ky:0,cd:[0,0,0],rcd:0,bl:0,ba:0,blcd:0,perf:0,dm:0,pur:0,blue:0,tk:0,bs:null,dom:0,dage:0,dtk:0,lr:-9,dc:0,ult:0,ut:0,d:[0,0],m1cd:0,cmb:0,cmbt:0,face:face,walk:0,punch:0}}

function start(k){CK=k;const ks=Object.keys(CH).filter(x=>x!==k),ok=ks[Math.floor(Math.random()*ks.length)];
  G={p:[mkE(k,-160,1),mkE(ok,160,-1)],s:[],fx:[],pops:[],t:0,st:'play',clash:null,bc:-9,lx:-160,ly:0,msg:'',mt:0,shk:0,flash:0,flashCol:'#fff'};
  BT.innerHTML='';const c=CH[k];
  [[0,c.sk[0].n],[1,c.sk[1].n],[2,c.sk[2].n],['m1','ضرب'],['bl','بلوك'],['rct','علاج'],['dom','مجال'],['ult','ألتميت'],['dash','داش']].forEach(([id,n])=>{
    const b=document.createElement('button');b.className='b'+(id==='dash'?' w':'')+(id==='m1'?' m1':'');
    b.id='b'+id;b.innerHTML='<i></i><span>'+n+'</span>';
    b.addEventListener('pointerdown',e=>{e.preventDefault();use(0,id)});BT.append(b)});
  ov.style.display='none';try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}

function pop(e,txt,c){G.pops.push({x:e.x,y:e.y-42,txt,c:c||'#fff',t:.9})}
function ring(x,y,c,r){G.fx.push({k:'r',x,y,t:0,c,r})}
function slashFx(x,y,c,cnt=4,sz=45){G.fx.push({k:'sl',x,y,t:0,c,cnt,sz,ang:Math.random()*3.14})}
function lightningFx(x,y){G.fx.push({k:'lt',x,y,t:0})}

function dmgTo(i,d,sure){const t=G.p[i],s=G.p[1-i];
  if(!sure){if(t.dash>0){pop(t,'تفادي','#9fffe0');return 0}if(t.bl>0){if(t.ba<.25){t.perf++;pop(t,'بلوك مثالي!','#ffd166');return 0}d*=.3}}
  t.hp=Math.max(0,t.hp-d);if(!G.clash&&!(s.dom>0))s.dm=Math.min(DOMCH,s.dm+d);
  pop(t,'-'+d);return d}

function use(i,k,tx,ty){if(!G||G.st!=='play')return;const e=G.p[i],t=G.p[1-i],c=CH[e.k];if(e.stun>0||e.dc>0)return;
  const ax=tx===undefined?t.x:tx,ay=ty===undefined?t.y:ty;if(ax!==e.x)e.face=ax>e.x?1:-1;
  
  if(k==='m1'){if(e.m1cd>0)return;e.m1cd=.32;e.punch=.22;
    const a=Math.atan2(ay-e.y,ax-e.x);e.x+=Math.cos(a)*18;e.y+=Math.sin(a)*18;
    ring(e.x,e.y,c.col,35);if(Math.hypot(t.x-e.x,t.y-e.y)<65+t.r)dmgTo(1-i,28);return}
  if(k==='dash'){if(e.dcd>0||e.dash>0)return;let[x,y]=e.d,l=Math.hypot(x,y);if(!l){x=ax-e.x;y=ay-e.y;l=Math.hypot(x,y)||1}e.dash=.18;e.dcd=1.1;e.dx=x/l;e.dy=y/l;return}
  if(k==='bl'){if(e.blcd>0||e.bl>0)return;e.bl=.6;e.ba=0;e.blcd=1.2;return}
  if(k==='rct'){if(e.rcd>0||e.hp>=e.max)return;e.rcd=18;e.hp=Math.min(e.max,e.hp+250);pop(e,'+250','#7dffa0');ring(e.x,e.y,'#7dffa0',45);return}
  if(k==='dom'){if(e.dm<DOMCH||e.dom>0||G.clash)return;e.dm=0;e.dc=CAST;G.flash=.4;G.flashCol=c.col;ring(e.x,e.y,c.col,300);G.msg='⚡ '+c.n+': توسع المجال!';G.mt=2.5;return}
  if(k==='ult'){if(e.ut<ULTCH||e.ult>0)return;e.ut=0;e.ult=ULT;ring(e.x,e.y,'#ffd166',240);G.msg=c.n+': طاقة القدرة القصوى!';G.mt=2.2;return}
  
  const b=c.sk[k];if(e.cd[k]>0)return;e.cd[k]=b.cd;const a=Math.atan2(ay-e.y,ax-e.x);
  if(b.t==='pull'||b.t==='orb'){
    G.s.push({o:i,k,x:e.x,y:e.y,vx:Math.cos(a)*(b.v||350),vy:Math.sin(a)*(b.v||350),dmg:b.dmg,ex:b.ex||80,col:b.col||c.col,life:3,big:1,sz:7});
  }else if(b.t==='slash'||b.t==='dash_strike'){
    ring(e.x,e.y,c.col,80);slashFx(t.x,t.y,c.col,5,50);dmgTo(1-i,b.dmg);if(c.style==='kashimo')lightningFx(t.x,t.y);
  }else if(b.t==='cleave'||b.t==='freeze_frame'){
    ring(e.x,e.y,c.col,90);t.stun=Math.max(t.stun,1);dmgTo(1-i,b.dmg);
  }else{
    const x2=e.x+Math.cos(a)*700,y2=e.y+Math.sin(a)*700;G.fx.push({k:'b',x1:e.x,y1:e.y,x2,y2,t:0,c:b.col||c.col});dmgTo(1-i,b.dmg,1);
  }
}

function bot(dt){const e=G.p[1],p=G.p[0],c=CH[e.k];
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  e.d=[dx/d*.7,dy/d*.7];if(e.stun>0)return;
  if(d<70&&e.m1cd<=0&&Math.random()<.08)use(1,'m1');
  if(e.dm>=DOMCH&&Math.random()<.02)use(1,'dom');
  c.sk.forEach((s,k)=>{if(e.cd[k]<=0&&d<400&&Math.random()<.03)use(1,k)});
}

function step(dt){if(!G||G.st!=='play')return;G.t+=dt;
  if(G.shk>0)G.shk=Math.max(0,G.shk-dt);if(G.flash>0)G.flash=Math.max(0,G.flash-dt);
  G.p[0].d=input();bot(dt);
  G.p.forEach((e,i)=>{const t=G.p[1-i],c=CH[e.k];
    ['rcd','dcd','blcd','pur','m1cd','cmbt','punch'].forEach(k=>e[k]=Math.max(0,e[k]-dt));
    e.cd=e.cd.map(x=>Math.max(0,x-dt));if(e.bl>0){e.bl-=dt;e.ba+=dt}if(e.ult>0)e.ult-=dt;
    if(e.dc>0){e.dc-=dt;if(e.dc<=0){e.dom=c.dom.dur;e.dage=0;e.dtk=0;G.msg='🔥 مجال مفعل!';G.mt=2}}
    if(e.dom>0){e.dom-=dt;if(Math.random()<.3)dmgTo(1-i,c.dom.dmg,1)}
    let d=e.d;if(Math.hypot(d[0],d[1])>.1){e.walk+=dt*14;if(Math.abs(d[0])>.15)e.face=d[0]>0?1:-1}else{e.walk=0}
    if(e.stun>0){e.stun-=dt;d=[0,0]}if(e.dash>0){e.dash-=dt;e.x+=e.dx*580*dt;e.y+=e.dy*580*dt}else{e.x+=d[0]*c.sp*dt;e.y+=d[1]*c.sp*dt}
  });
  G.s=G.s.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;const t=G.p[1-s.o];
    if(Math.hypot(s.x-t.x,s.y-t.y)<t.r+15){dmgTo(1-s.o,s.dmg);ring(s.x,s.y,s.col,70);return false}
    return s.life>0;
  });
  G.fx.forEach(f=>f.t+=dt);G.fx=G.fx.filter(f=>f.t<.38);G.pops.forEach(p=>{p.t-=dt;p.y-=28*dt});G.pops=G.pops.filter(p=>p.t>0);G.mt-=dt;
  if(G.p[0].hp<=0||G.p[1].hp<=0){G.st='over';const w=G.p[1].hp<=0;ui(w?'🏆 فزت في المعركة!':'💀 خسرت المعركة!','اختر إعادة المحاولة',[['إعادة المحاولة',()=>start(CK)],['القائمة الرئيسية',menu,'s']])}
}

function input(){let x=joy.on?joy.x/50:0,y=joy.on?joy.y/50:0;if(keys.a||keys.ArrowLeft)x-=1;if(keys.d||keys.ArrowRight)x+=1;if(keys.w||keys.ArrowUp)y-=1;if(keys.s||keys.ArrowDown)y+=1;return[x,y]}

const X=x=>cx+x*S,Y=y=>cy+y*S;
function drawArena(){
  const grd=g.createRadialGradient(X(0),Y(0),20*S,X(0),Y(0),A*S);
  grd.addColorStop(0,'#161d59');grd.addColorStop(1,'#090d2e');
  g.beginPath();g.arc(X(0),Y(0),A*S,0,7);g.fillStyle=grd;g.fill();
  g.strokeStyle='rgba(79,195,255,0.2)';g.lineWidth=2.5;g.stroke();
}

function drawStickman(e){
  const c=CH[e.k],px=X(e.x),py=Y(e.y),sc=S*1.15,f=e.face;
  g.fillStyle='rgba(0,0,0,0.5)';g.beginPath();g.ellipse(px,py+22*sc,14*sc,5*sc,0,0,7);g.fill();
  g.save();g.translate(px,py);g.strokeStyle=c.col;g.fillStyle=c.col;g.lineWidth=3.8*sc;g.lineCap='round';
  g.beginPath();g.arc(0,-16*sc,7.5*sc,0,7);g.fill();
  g.beginPath();g.moveTo(0,-8*sc);g.lineTo(0,8*sc);g.stroke();
  g.beginPath();g.moveTo(0,8*sc);g.lineTo(-6*sc,21*sc);g.moveTo(0,8*sc);g.lineTo(6*sc,21*sc);g.stroke();
  g.beginPath();g.moveTo(0,-4*sc);g.lineTo(f*12*sc,2*sc);g.moveTo(0,-4*sc);g.lineTo(-f*10*sc,2*sc);g.stroke();
  g.restore();
}

let lt=0;
function draw(t){const dt=Math.min(.033,(t-lt)/1000||0);lt=t;step(dt);
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);drawArena();
  if(G){
    G.fx.forEach(f=>{g.globalAlpha=1-f.t/.38;g.strokeStyle=f.c;g.lineWidth=12*S;g.beginPath();g.arc(X(f.x||0),Y(f.y||0),30*S,0,7);g.stroke();g.globalAlpha=1});
    G.s.forEach(s=>{g.fillStyle=s.col;g.beginPath();g.arc(X(s.x),Y(s.y),8*S,0,7);g.fill()});
    drawStickman(G.p[1]);drawStickman(G.p[0]);
    g.font='700 15px system-ui';g.textAlign='center';G.pops.forEach(p=>{g.fillStyle=p.c;g.fillText(p.txt,X(p.x),Y(p.y))});
    const bw=(W-44)/2;
    [[0,14],[1,W-14-bw]].forEach(([i,x0])=>{const e=G.p[i],c=CH[e.k];g.fillStyle='#1a2150';g.fillRect(x0,12,bw,10);g.fillStyle=c.col;g.fillRect(x0,12,bw*e.hp/e.max,10);g.fillStyle='#fff';g.font='11px system-ui';g.fillText(c.n+' '+e.hp,i?x0+bw:x0,36)});
    if(G.mt>0){g.fillStyle='#ffd166';g.font='700 18px system-ui';g.fillText(G.msg,W/2,65)}
  }
  requestAnimationFrame(draw);
}

const pad=document.getElementById('pad');
pad.addEventListener('pointerdown',e=>{joy.on=true;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=0;joy.y=0});
pad.addEventListener('pointermove',e=>{if(!joy.on)return;joy.x=Math.max(-50,Math.min(50,e.clientX-joy.ox));joy.y=Math.max(-50,Math.min(50,e.clientY-joy.oy))});
['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,()=>joy.on=false));
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')use(0,'dash')});
addEventListener('keyup',e=>keys[e.key]=false);

rs();menu();requestAnimationFrame(draw);
</script>
</body>
</html>
