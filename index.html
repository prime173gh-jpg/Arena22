<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساحة المعركة - 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#090c26">
<style>
:root{--bg:#090c26;--ink:#eaf2ff;--line:#2a3478;color-scheme:dark;box-sizing:border-box;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%}
#pad{position:absolute;left:0;top:25%;width:45%;bottom:0}
#btns{position:absolute;right:8px;bottom:12px;display:grid;grid-template-columns:repeat(3,60px);gap:7px;direction:ltr;z-index:5}
.b{height:60px;border-radius:50%;border:2px solid var(--line);background:#141a45;color:var(--ink);font:600 11px system-ui;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0;touch-action:none}
.b:active{background:#222c7a}
.b.m1{border-color:#ff7b7b;background:#26142e}
.b.w{border-radius:30px;border-color:#4fc3ff}
.b.rdy{border-color:#ffd166;box-shadow:0 0 14px #ffd166}
.b i{position:absolute;inset:0;background:rgba(5,8,30,.75);transform-origin:bottom;transform:scaleY(0)}
.b span{position:relative}
#ov{position:absolute;inset:0;background:rgba(6,9,30,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:10}
#ov h1{margin:0;font-size:28px;color:#4fc3ff}
#ov p{margin:0;max-width:330px;line-height:1.6;color:#b9c6ff;font-size:14px}
@media (orientation:landscape) and (max-height:540px){#btns{grid-template-columns:repeat(3,52px);gap:5px;bottom:8px;right:8px}.b{height:52px;font-size:10px}.b.w{border-radius:26px}#pad{top:12%;width:40%}#ov h1{font-size:22px}#ov{gap:8px;padding:12px}#bx button{padding:9px 24px;font-size:15px}}
#ov textarea{width:min(88vw,330px);height:120px;direction:ltr;background:#141a45;color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:12px;padding:8px;user-select:text;-webkit-user-select:text}
#ov{touch-action:auto}
#bx{display:flex;flex-direction:column;gap:9px;align-items:center}
#bx button{font:600 17px system-ui;padding:12px 26px;border-radius:26px;border:0;background:#4fc3ff;color:#04122a;min-width:220px;cursor:pointer}
#bx button.s{background:#1b2260;color:var(--ink);font-size:14px;padding:9px 20px}
.diff-row{display:flex;gap:8px;margin-bottom:4px}
.diff-btn{padding:7px 14px!important;min-width:auto!important;font-size:13px!important;border-radius:14px!important;background:#1b2260!important;color:#fff!important;border:2px solid transparent!important}
.diff-btn.active{border-color:#ffd166!important;background:#2a358c!important;color:#ffd166!important}
</style>
<!-- استدعاء مكتبة Three.js للرسومات الثلاثية الأبعاد -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="c"></div>
<div id="pad"></div>
<div id="btns"></div>
<div id="ov"><h1 id="t"></h1><p id="m"></p><div id="df"></div><textarea id="ta" style="display:none"></textarea><div id="bx"></div></div>
<script>
/* ===== الشخصيات والمهارات ===== */
const CH={
 gojo:{n:'جوجو',style:'gojo',hp:1500,col:0x4fc3ff,sp:190,rng:230,
  sk:[{n:'أزرق',t:'pull',cd:7,dur:1.6,tick:.125,dmg:18},
      {n:'أحمر',t:'orb',cd:5,dmg:65,ex:85,v:350,bn:1,col:0xff5a6a,u:{dmg:140,ex:180}},
      {n:'بنفسجي',t:'beam',cd:10,dmg:280,w:50,need:1,col:0xb86bff}],
  dom:{n:'الفراغ اللانهائي',type:'freeze',tick:.5,dmg:30,dur:7}},
 suk:{n:'سوكونا',style:'sukuna',hp:1500,col:0xff4d5e,sp:185,rng:115,
  sk:[{n:'تفكيك',t:'slash',cd:2.5,dmg:32,cnt:3,v:620},
      {n:'تقطيع',t:'cleave',cd:4,dmg:75,r:90},
      {n:'سهم النار',t:'orb',cd:7,dmg:95,ex:95,v:410,bn:0,col:0xff9a3c,u:{dmg:190,ex:175}}],
  dom:{n:'المزار الشرير',type:'shrine',tick:.25,dmg:28,dur:7}}
};

const DOMCH=200,ULTCH=300,ULT=10,CLASH=30,CAST=2.2,A=220;
const TY=['pull','orb','beam','slash','cleave'],DF={pull:{dur:1.5,tick:.125,dmg:15},orb:{v:320,ex:85,bn:0,col:0xff9a3c},beam:{w:45,col:0xb86bff},slash:{cnt:3,v:580},cleave:{r:85}};

function fix(c){try{if(!c||!c.id||!c.n||!(c.hp>0)||!Array.isArray(c.sk)||c.sk.length!==3)return null;
  c.sp=c.sp||180;c.rng=c.rng||150;c.col=c.col||0xffffff;c.style=c.style||'default';c.dom=Object.assign({n:'مجال',type:'shrine',tick:.5,dmg:30,dur:7},c.dom);
  c.sk=c.sk.map(s=>{if(!TY.includes(s.t))throw 0;return Object.assign({n:s.t,cd:5,dmg:40},DF[s.t],s)});return c}catch(e){return null}}
try{const cc=JSON.parse(localStorage.getItem('cc')||'{}');for(const k in cc){const c=fix(JSON.parse(JSON.stringify(cc[k])));if(c)CH[k]=c}}catch(e){}

const container=document.getElementById('c'),ov=document.getElementById('ov'),BT=document.getElementById('btns');
let scene,camera,renderer,G=null,CK='gojo',DIFF=0.25,keys={},M={v:[0,0],near:220,dodge:.3,lvl:.25,n:0,w:{}};
try{M=Object.assign(M,JSON.parse(localStorage.getItem('bm')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bm',JSON.stringify(M))}catch(e){}};
const joy={on:false,id:null,ox:0,oy:0,x:0,y:0},B={};

// إعداد عالم الـ Three.js ثلاثي الأبعاد
function init3D(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x090c26);
  scene.fog=new THREE.FogExp2(0x090c26, 0.0018);

  camera=new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 1, 2000);
  camera.position.set(0, 320, 380);
  camera.lookAt(0, 0, 0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // إضاءة الحلبة
  const ambientLight=new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight=new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(200, 400, 200);
  scene.add(dirLight);

  // بناء الحلبة المجسمة (Arena Platform)
  const arenaGeo=new THREE.CylinderGeometry(A, A, 14, 48);
  const arenaMat=new THREE.MeshStandardMaterial({color:0x0e1342, roughness:0.4, metalness:0.2});
  const arenaMesh=new THREE.Mesh(arenaGeo, arenaMat);
  arenaMesh.position.y=-7;
  scene.add(arenaMesh);

  // حافة الحلبة المضيئة
  const ringGeo=new THREE.RingGeometry(A-2, A+2, 48);
  const ringMat=new THREE.MeshBasicMaterial({color:0x4fc3ff, side:THREE.DoubleSide});
  const ringMesh=new THREE.Mesh(ringGeo, ringMat);
  ringMesh.rotation.x=Math.PI/2;
  ringMesh.position.y=0.2;
  scene.add(ringMesh);

  window.addEventListener('resize', onWindowResize);
}

function onWindowResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// بناء شخصية Stickman 3D مجسمة
function createStickmanMesh(c){
  const group=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:c.col, roughness:0.3});

  // الرأس
  const headGeo=new THREE.SphereGeometry(12, 16, 16);
  const head=new THREE.Mesh(headGeo, mat);
  head.position.y=60;
  group.add(head);

  // الجسم
  const bodyGeo=new THREE.CylinderGeometry(4, 4, 32, 8);
  const body=new THREE.Mesh(bodyGeo, mat);
  body.position.y=36;
  group.add(body);

  // الأذرع
  const armGeo=new THREE.CylinderGeometry(3, 3, 28, 8);
  const leftArm=new THREE.Mesh(armGeo, mat);
  leftArm.position.set(-12, 42, 0);
  group.add(leftArm);

  const rightArm=new THREE.Mesh(armGeo, mat);
  rightArm.position.set(12, 42, 0);
  group.add(rightArm);

  // الأرجل
  const legGeo=new THREE.CylinderGeometry(3.5, 3.5, 32, 8);
  const leftLeg=new THREE.Mesh(legGeo, mat);
  leftLeg.position.set(-7, 16, 0);
  group.add(leftLeg);

  const rightLeg=new THREE.Mesh(legGeo, mat);
  rightLeg.position.set(7, 16, 0);
  group.add(rightLeg);

  scene.add(group);
  return {group, head, leftArm, rightArm, leftLeg, rightLeg, mat};
}

function ui(t,m,btns,ta,showDiff=false){
  ov.style.display='flex';
  document.getElementById('t').textContent=t;
  document.getElementById('m').innerHTML=m||'';
  const df=document.getElementById('df');
  df.innerHTML='';
  if(showDiff){
    const row=document.createElement('div');row.className='diff-row';
    [['سهل',0.2],['متوسط',0.45],['صعب',0.85]].forEach(([lbl,val])=>{
      const b=document.createElement('button');
      b.className='diff-btn'+(DIFF===val?' active':'');
      b.textContent='مستوى: '+lbl;
      b.onclick=()=>{DIFF=val;M.lvl=val;save();ui(t,m,btns,ta,true)};
      row.append(b);
    });
    df.append(row);
  }
  const TA=document.getElementById('ta');TA.style.display=ta===undefined?'none':'block';if(ta!==undefined)TA.value=ta;
  const bx=document.getElementById('bx');bx.innerHTML='';
  btns.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;if(c)b.className=c;b.onclick=f;bx.append(b)})
}

function menu(){G=null;ui('ساحة القتال - 3D','اختر الصعوبة وشخصيتك وابدأ المعركة المجسمة!',
  Object.keys(CH).map(k=>['العب بـ '+CH[k].n,()=>start(k)]).concat([['شخصياتي: إضافة وتعديل',editor,'s']]),undefined,true)}

const TPL={id:'kashimo',n:'كاشيمو',style:'default',hp:1400,col:0xffe14a,sp:195,rng:150,sk:[{n:'صاعقة',t:'slash',cd:2.5,dmg:38,cnt:3,v:650},{n:'ضربة كهربا',t:'cleave',cd:4,dmg:85,r:90},{n:'كورة برق',t:'orb',cd:7,dmg:90,ex:95,v:390}],dom:{n:'مجال البرق',type:'shrine',tick:.3,dmg:32,dur:7}};
const ta=()=>document.getElementById('ta');

function editor(){let cc={};try{cc=JSON.parse(localStorage.getItem('cc')||'{}')}catch(e){}
  ui('شخصياتي','الصق كود الشخصية واضغط حفظ. المحفوظ: '+(Object.keys(cc).join('، ')||'لا شيء'),
  [['حفظ',()=>{try{const j=JSON.parse(ta().value),L=j.id?[j]:Object.values(j);let n=0;
      L.forEach(x=>{const c=fix(JSON.parse(JSON.stringify(x)));if(c){cc[c.id]=x;CH[c.id]=c;n++}});if(!n)throw 0;
      localStorage.setItem('cc',JSON.stringify(cc));editor()}catch(e){document.getElementById('m').textContent='الكود فيه غلط، جرب القالب الجاهز.'}}],
   ['قالب جاهز',()=>ta().value=JSON.stringify(TPL,null,1),'s'],
   ['تصدير المحفوظ',()=>ta().value=JSON.stringify(cc),'s'],
   ['حذف: اكتب الـ id',()=>{const k=ta().value.trim();if(cc[k]){delete cc[k];delete CH[k];localStorage.setItem('cc',JSON.stringify(cc))}editor()},'s'],
   ['رجوع',menu,'s']],'')}

function mkE(k,x,face){
  const mesh=createStickmanMesh(CH[k]);
  return{k,x,z:0,y:0,hp:CH[k].hp,max:CH[k].hp,r:22,dash:0,dcd:0,dx:0,dz:0,stun:0,kx:0,kz:0,cd:[0,0,0],rcd:0,bl:0,ba:0,blcd:0,perf:0,dm:0,pur:0,blue:0,tk:0,bs:null,dom:0,dage:0,dtk:0,lr:-9,dc:0,ult:0,ut:0,d:[0,0],m1cd:0,cmb:0,cmbt:0,face:face,walk:0,punch:0,mesh}
}

function start(k){
  CK=k;const ks=Object.keys(CH).filter(x=>x!==k),ok=ks[Math.floor(Math.random()*ks.length)];
  M.w[ok]=M.w[ok]||[1,1,1];
  
  // تنظيف الكائنات القديمة من المشهد لو موجودة
  if(G){G.p.forEach(e=>scene.remove(e.mesh.group));G.s.forEach(s=>scene.remove(s.mesh))}

  G={p:[mkE(k,-140,1),mkE(ok,140,-1)],s:[],fx:[],pops:[],t:0,st:'play',clash:null,bc:-9,lx:-140,lz:0,msg:'',mt:0,shk:0,flash:0};
  Object.assign(B,{rt:0});
  BT.innerHTML='';const c=CH[k];
  [[0,c.sk[0].n],[1,c.sk[1].n],[2,c.sk[2].n],['m1','ضرب'],['bl','بلوك'],['rct','علاج'],['dom','مجال'],['ult','ألتميت'],['dash','داش']].forEach(([id,n])=>{
    const b=document.createElement('button');
    b.className='b'+(id==='dash'?' w':'')+(id==='m1'?' m1':'');
    b.id='b'+id;b.innerHTML='<i></i><span>'+n+'</span>';
    b.addEventListener('pointerdown',e=>{e.preventDefault();use(0,id)});BT.append(b)});
  ov.style.display='none';try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}

function pop(e,txt,c){G.pops.push({x:e.x,y:e.z,txt,c:c||'#fff',t:.9})}
function ring(x,z,c,r){/* تأثير دائري في الـ 3D */}

function dmgTo(i,d,sure){const t=G.p[i],s=G.p[1-i];
  if(!sure){if(t.dash>0){pop(t,'تفادي','#9fffe0');return 0}
    if(t.bl>0){if(t.ba<.25){t.perf++;pop(t,'بلوك مثالي +'+(t.perf*10)+'%','#ffd166');return 0}d*=.3}}
  d=Math.round(d*(1+.1*s.perf));t.hp=Math.max(0,t.hp-d);
  if(!G.clash&&!(s.dom>0))s.dm=Math.min(DOMCH,s.dm+d);
  if(!(s.ult>0))s.ut=Math.min(ULTCH,s.ut+d);
  if(!(t.ult>0))t.ut=Math.min(ULTCH,t.ut+d*.4);
  if(G.clash)G.clash.dmg[1-i]+=d;
  pop(t,'-'+d);return d}

function usk(e,k){const b=CH[e.k].sk[k],o=Object.assign({},b);
  if(e.ult>0){if(b.u)Object.assign(o,b.u);else{o.dmg=b.dmg*2;if(b.ex)o.ex=b.ex*1.8;if(b.r)o.r=b.r*1.6;if(b.w)o.w=b.w*1.8;if(b.cnt)o.cnt=b.cnt+2;if(b.dur)o.dur=b.dur*1.5}}return o}

function learn(i,k,ok){if(i!==1)return;const w=M.w[G.p[1].k];w[k]=Math.max(.3,Math.min(3,w[k]+(ok?.2:-.1)))}

function use(i,k,tx,tz){if(!G||G.st!=='play')return;const e=G.p[i],t=G.p[1-i],c=CH[e.k];if(e.stun>0||e.dc>0)return;
  const ax=tx===undefined?t.x:tx,az=tz===undefined?t.z:tz;
  if(ax!==e.x)e.face=ax>e.x?1:-1;
  
  if(k==='m1'){if(e.m1cd>0)return;
    e.m1cd=.32;e.punch=.22;
    if(e.cmbt<=0)e.cmb=0;
    e.cmb++;e.cmbt=1.3;
    const isFinisher=(e.cmb>=3);
    if(isFinisher)e.cmb=0;
    const a=Math.atan2(az-e.z,ax-e.x);
    e.x+=Math.cos(a)*18;e.z+=Math.sin(a)*18;
    const dist=Math.hypot(t.x-e.x,t.z-e.z);
    const rng=isFinisher?75:62;
    if(dist<rng+t.r){
      const dmg=isFinisher?50:25;
      if(dmgTo(1-i,dmg)>0){
        if(isFinisher){
          t.kx+=Math.cos(a)*420;t.kz+=Math.sin(a)*420;
          t.stun=.35;G.shk=.15;
          pop(t,'ضربة قاضية!','#ffd166');
          e.lr=G.t;
        }else{
          t.kx+=Math.cos(a)*100;t.kz+=Math.sin(a)*100;
        }
      }
    }
    return}

  if(k==='dash'){if(e.dcd>0||e.dash>0)return;let[x,z]=e.d,l=Math.hypot(x,z);if(!l){x=ax-e.x;z=az-e.z;l=Math.hypot(x,z)||1}
    e.dash=.17;e.dcd=1.1;e.dx=x/l;e.dz=z/l;return}
  if(k==='bl'){if(e.blcd>0||e.bl>0)return;e.bl=.6;e.ba=0;e.blcd=1.2;return}
  if(k==='rct'){if(e.rcd>0||e.hp>=e.max)return;e.rcd=18;e.hp=Math.min(e.max,e.hp+250);pop(e,'+250','#7dffa0');return}
  if(k==='dom'){if(e.dm<DOMCH||e.dom>0||G.clash)return;e.dm=0;e.dc=CAST;
    G.flash=.35;G.shk=.3;
    G.msg='⚡ '+c.n+': توسع المجال!';G.mt=2.2;
    if(t.dc>0||(t.dom>0&&t.dage<1.5)){t.dom=0;G.clash={t:CLASH,dmg:[0,0]};G.msg='تصادم مجالات!';G.mt=2.5;G.shk=.4}return}
  if(k==='ult'){if(e.ut<ULTCH||e.ult>0)return;e.ut=0;e.ult=ULT;G.msg=c.n+': ألتميت!';G.mt=2;G.shk=.25;return}
  
  const s=usk(e,k);if(e.cd[k]>0||(s.need&&e.pur<=0))return;e.cd[k]=s.cd;if(i===1)G.bc=G.t;
  const a=Math.atan2(az-e.z,ax-e.x);

  if(s.t==='pull'){e.blue=s.dur;e.tk=0;e.bs=s;if(G.t-e.lr<2.5)e.pur=4}
  if(s.t==='orb'||s.t==='slash'||s.t==='beam'){
    // إنشاء مقذوف ثلاثي الأبعاد في المشهد
    const sphGeo=new THREE.SphereGeometry(s.t==='beam'?12:16, 16, 16);
    const sphMat=new THREE.MeshBasicMaterial({color:s.col});
    const mesh=new THREE.Mesh(sphGeo, sphMat);
    mesh.position.set(e.x, 25, e.z);
    scene.add(mesh);

    G.s.push({o:i,k,x:e.x,z:e.z,vx:Math.cos(a)*s.v,vz:Math.sin(a)*s.v,dmg:s.dmg,col:s.col,life:3,mesh});
    e.lr=G.t;if(e.blue>0)e.pur=4;
  }
  if(s.t==='cleave'){const d=Math.hypot(t.x-e.x,t.z-e.z);
    learn(i,k,d<s.r+t.r&&dmgTo(1-i,s.dmg+(1-t.hp/t.max)*80)>0)}
}

function bot(dt){const e=G.p[1],p=G.p[0],c=CH[e.k],w=M.w[e.k],L=DIFF;
  const dx=p.x-e.x,dz=p.z-e.z,d=Math.hypot(dx,dz)||1,ux=dx/d,uz=dz/d;
  M.v[0]=M.v[0]*.95+(p.x-G.lx)/dt*.05;M.v[1]=M.v[1]*.95+(p.z-G.lz)/dt*.05;G.lx=p.x;G.lz=p.z;
  B.t=(B.t||0)+dt;
  const spdMult=0.6+L*0.4;
  let rng=c.rng,m;if(d>rng+55)m=[ux,uz];else if(d<rng-45)m=[-ux,-uz];else{if(!B.sw||B.t>B.sw){B.sd=Math.random()<.5?1:-1;B.sw=B.t+1.2+Math.random()*1.5}m=[-uz*B.sd,ux*B.sd]}
  e.d=[m[0]*spdMult,m[1]*spdMult];
  if(e.stun>0)return;
  if(d<65&&e.m1cd<=0&&Math.random()<.04+L*.08)use(1,'m1');
  if(e.dm>=DOMCH&&Math.random()<.015)use(1,'dom');
  let best=-1,bs=0,forced=false;
  c.sk.forEach((s,k)=>{if(e.cd[k]>0||(s.need&&e.pur<=0))return;
    let x=w[k]*(d<420?1:.3);if(x>bs){bs=x;best=k}});
  if(best>=0&&Math.random()<.02+L*.045){use(1,best,p.x,p.z)}}

function step(dt){if(!G||G.st!=='play')return;G.t+=dt;
  if(G.shk>0)G.shk=Math.max(0,G.shk-dt);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt);
  const P=G.p[0];P.d=input();bot(dt);
  
  G.p.forEach((e,i)=>{const t=G.p[1-i],c=CH[e.k];
    ['rcd','dcd','blcd','pur','m1cd','cmbt','punch'].forEach(k=>e[k]=Math.max(0,e[k]-dt));
    e.cd=e.cd.map(x=>Math.max(0,x-dt));
    if(e.bl>0){e.bl-=dt;e.ba+=dt}
    if(e.ult>0)e.ult-=dt;
    if(e.dc>0){e.dc-=dt;if(e.dc<=0&&!G.clash){e.dom=c.dom.dur;e.dage=0;e.dtk=0;G.msg='🔥 '+c.dom.n+' مفعّل!';G.mt=2.2}}
    if(e.dom>0){e.dom-=dt;e.dage+=dt;e.dtk-=dt;if(c.dom.type==='freeze')t.stun=Math.max(t.stun,.25);if(e.dtk<=0){e.dtk+=c.dom.tick;dmgTo(1-i,c.dom.dmg,1)}}

    let d=e.d;if(Math.hypot(d[0],d[1])>.1)e.face=d[0]>0?1:-1;
    if(e.stun>0){e.stun-=dt;d=[0,0]}if(e.dc>0){d=[0,0];e.dash=0}const sp=c.sp*(e.bl>0?.4:1);
    if(e.dash>0){e.dash-=dt;e.x+=e.dx*560*dt;e.z+=e.dz*560*dt}else{e.x+=d[0]*sp*dt;e.z+=d[1]*sp*dt}
    e.x+=e.kx*dt;e.z+=e.kz*dt;e.kx*=0.85;e.kz*=0.85;

    // تحديث مكان موديل الـ Stickman في الـ 3D
    e.mesh.group.position.set(e.x, 0, e.z);
    e.mesh.group.rotation.y=e.face>0?-Math.PI/2:Math.PI/2;
  });

  G.p.forEach(e=>{const r=Math.hypot(e.x,e.z),m=A-e.r;if(r>m){e.x*=m/r;e.z*=m/r}});

  // تحديث المقذوفات 3D
  G.s=G.s.filter(s=>{
    s.x+=s.vx*dt;s.z+=s.vz*dt;s.life-=dt;
    s.mesh.position.set(s.x, 25, s.z);
    const t=G.p[1-s.o];
    if(Math.hypot(s.x-t.x,s.z-t.z)<t.r+15){
      dmgTo(1-s.o,35);
      scene.remove(s.mesh);
      return false;
    }
    if(s.life<=0||Math.hypot(s.x,s.z)>A){scene.remove(s.mesh);return false}
    return true;
  });

  if(G.clash){G.clash.t-=dt;if(G.clash.t<=0){G.clash=null}}
  if(G.p[0].hp<=0||G.p[1].hp<=0){G.st='over';const w=G.p[1].hp<=0;M.n++;save();
    ui(w?'🏆 فزت في معركة 3D!':'💀 اتغلبت!','أداء عظيم في البعد الثالث!',[['العب تاني',()=>start(CK)],['القائمة الرئيسية',menu,'s']])}
}

function input(){let x=joy.on?joy.x/50:0,z=joy.on?joy.y/50:0;
  if(keys.a||keys.ArrowLeft)x-=1;if(keys.d||keys.ArrowRight)x+=1;if(keys.w||keys.ArrowUp)z-=1;if(keys.s||keys.ArrowDown)z+=1;
  const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}return[x,z]}

function animate(){
  requestAnimationFrame(animate);
  const dt=0.016;
  step(dt);
  if(renderer&&scene&&camera)renderer.render(scene,camera);
}

const pad=document.getElementById('pad');
function lp(e){const r=container.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);const[x,y]=lp(e);Object.assign(joy,{on:true,id:e.pointerId,ox:x,oy:y,x:0,y:0})});
pad.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const[x,y]=lp(e);let dx=x-joy.ox,dy=y-joy.oy;const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l}joy.x=dx;joy.y=dy});
['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,e=>{if(e.pointerId===joy.id)joy.on=false}));
addEventListener('keydown',e=>{keys[e.key]=true;const m={' ':'dash',f:'m1',1:0,2:1,3:2,q:'bl',e:'rct',r:'dom',u:'ult'}[e.key.toLowerCase()];if(m!==undefined){e.preventDefault();use(0,m)}});
addEventListener('keyup',e=>keys[e.key]=false);

init3D();
menu();
animate();
</script>
</body>
