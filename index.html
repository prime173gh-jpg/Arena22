
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090c26">
<title>ساحة المعركة - Ultimate Anime</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#090c26;color:#fff;font-family:Tahoma,Arial,sans-serif;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#menu{position:absolute;inset:0;z-index:5;background:#090c26ed;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:15px;overflow:auto;text-align:center}
h1{color:#4fc3ff;margin:5px;font-size:30px}
p{color:#b9c6ff;line-height:1.7}
#characters{display:grid;grid-template-columns:repeat(3,minmax(90px,130px));gap:10px;margin:15px}
button{border:1px solid #3949ab;background:#171e50;color:white;border-radius:12px;padding:12px;cursor:pointer;font-size:14px}
button:hover{background:#293887}
button:active{transform:scale(.96)}
.selected{border:2px solid #ffd166;color:#ffd166}
#start{background:#4fc3ff;color:#06132d;font-weight:bold;width:220px;font-size:18px}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
.bars{position:absolute;top:12px;width:40%;height:16px;background:#171e50;border:1px solid #5969ae;border-radius:8px;overflow:hidden}
#pbar{left:12px}
#ebar{right:12px}
.fill{height:100%;background:#4fc3ff;transition:width .1s}
#enemyfill{background:#ff526d}
#buttons{position:absolute;bottom:15px;right:15px;display:grid;grid-template-columns:repeat(3,65px);gap:7px;pointer-events:auto}
#buttons button{height:58px;border-radius:50%;padding:3px;font-size:11px;background:#171e50}
#buttons .special{border-color:#ffd166}
#help{position:absolute;bottom:12px;left:12px;color:#cbd5ff;font-size:12px;line-height:2}
#message{position:absolute;top:65px;width:100%;text-align:center;color:#ffd166;font-size:18px;font-weight:bold}
#back{position:absolute;top:55px;left:12px;pointer-events:auto}
@media(max-width:600px){
#characters{grid-template-columns:repeat(2,115px)}
#buttons{grid-template-columns:repeat(3,54px);gap:5px}
#buttons button{height:52px;font-size:10px}
#help{font-size:9px}
h1{font-size:23px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
<h1>⚡ ساحة المعركة</h1>
<p>ULTIMATE ANIME 2D<br>اختر مقاتلك وابدأ المعركة الأسطورية</p>
<div id="characters"></div>
<p id="description">اختر شخصية للبدء</p>
<button id="start">ابدأ المعركة</button>
<p>مستوى الصعوبة</p>
<div>
<button onclick="setDifficulty(.25,this)" class="selected">سهل</button>
<button onclick="setDifficulty(.5,this)">متوسط</button>
<button onclick="setDifficulty(.9,this)">صعب</button>
</div>
</div>

<div id="hud">
<div class="bars" id="pbar"><div class="fill" id="playerfill"></div></div>
<div class="bars" id="ebar"><div class="fill" id="enemyfill"></div></div>
<div id="message"></div>
<button id="back" onclick="goMenu()">القائمة</button>
<div id="help">
W A S D : حركة<br>
J : ضرب عادي<br>
1 / 2 / 3 : مهارات<br>
Q : صد | Space : داش<br>
E : علاج | R : مجال | U : ألتميت
</div>
<div id="buttons">
<button onclick="skill(0)">مهارة 1</button>
<button onclick="skill(1)">مهارة 2</button>
<button onclick="skill(2)">مهارة 3</button>
<button onclick="attack()">ضرب</button>
<button onclick="block()">صد</button>
<button onclick="dash()">داش</button>
<button onclick="heal()">علاج</button>
<button class="special" onclick="domain()">مجال</button>
<button class="special" onclick="ultimate()">ألتميت</button>
</div>
</div>

<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

if(!ctx){
 document.getElementById('description').textContent='المتصفح لا يدعم Canvas 2D';
 throw new Error('Canvas unavailable');
}

const characters={
 gojo:{name:'جوجو',color:'#4fc3ff',hp:1500,speed:205,range:180,skills:[
 ['أزرق',25,5],['أحمر',100,4],['بنفسجي',230,8]],domain:'الفراغ اللانهائي'},
 sukuna:{name:'سوكونا',color:'#ff4d5e',hp:1500,speed:195,range:130,skills:[
 ['تفكيك',45,2],['تقطيع',90,4],['سهم النار',130,6]],domain:'المزار الشرير'},
 kashimo:{name:'كاشيمو',color:'#3b82f6',hp:1450,speed:210,range:160,skills:[
 ['صاعقة برق',50,2],['صدمة رعدية',95,4],['برق متسلسل',130,6]],domain:'حقل التفريغ'},
 naoya:{name:'ناويا',color:'#10b981',hp:1400,speed:230,range:155,skills:[
 ['إسقاط زمني',65,3],['تجميد إطارات',90,5],['سرعة الصوت',120,6]],domain:'مملكة الإطارات'},
 hakari:{name:'هاكاري',color:'#f59e0b',hp:1600,speed:195,range:130,skills:[
 ['لكمات متتالية',50,2],['ضربة الحظ',100,4],['طاقة Jackpot',140,6]],domain:'سرايا المقامرة'},
 toji:{name:'توجي',color:'#94a3b8',hp:1550,speed:220,range:135,skills:[
 ['سلسلة الموت',55,2],['طعنة سماوية',110,4],['هجوم مباغت',130,6]],domain:'ساحة الجسد السماوي'}
};

let selected='gojo';
let difficulty=.25;
let player,enemy,active=false;
let keys={};
let effects=[];
let particles=[];
let last=0;
let message='';
let messageTime=0;
let W=0,H=0;
let cooldowns=[0,0,0];
let domainEnergy=0,ultEnergy=0;
let domainTime=0,ultTime=0;
let dashTime=0,blockTime=0,healCooldown=0;
let arenaRadius=0;

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;
 H=innerHeight;
 canvas.width=Math.floor(W*dpr);
 canvas.height=Math.floor(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 arenaRadius=Math.min(W,H)*.39;
}
addEventListener('resize',resize);
resize();

const list=document.getElementById('characters');

Object.keys(characters).forEach(key=>{
 const b=document.createElement('button');
 b.textContent=characters[key].name;
 b.onclick=()=>{
  selected=key;
  document.querySelectorAll('#characters button').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  document.getElementById('description').textContent=
  characters[key].name+' - '+characters[key].domain;
 };
 list.appendChild(b);
 if(key==='gojo')b.classList.add('selected');
});

function setDifficulty(v,b){
 difficulty=v;
 b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected');
}

function fighter(key,x,isPlayer){
 const c=characters[key];
 return {
  key,x,y:0,hp:c.hp,max:c.hp,
  color:c.color,speed:c.speed,
  isPlayer,attackCD:0,stun:0,
  dash:0,blocking:0,face:isPlayer?1:-1
 };
}

function start(){
 const options=Object.keys(characters).filter(x=>x!==selected);
 const random=options[Math.floor(Math.random()*options.length)];

 player=fighter(selected,-90,true);
 enemy=fighter(random,90,false);

 cooldowns=[0,0,0];
 domainEnergy=0;
 ultEnergy=0;
 domainTime=0;
 ultTime=0;
 dashTime=0;
 blockTime=0;
 healCooldown=0;
 effects=[];
 particles=[];
 active=true;

 document.getElementById('menu').style.display='none';
 document.getElementById('hud').style.display='block';

 say('بدأت المعركة!');
}

document.getElementById('start').onclick=start;

function goMenu(){
 active=false;
 document.getElementById('menu').style.display='flex';
 document.getElementById('hud').style.display='none';
}

function say(t){
 message=t;
 messageTime=2;
 document.getElementById('message').textContent=t;
}

function clamp(p){
 const d=Math.hypot(p.x,p.y);
 const max=arenaRadius-25;
 if(d>max){
  p.x*=max/d;
  p.y*=max/d;
 }
}

function damage(target,amount){
 if(!active)return;
 if(target.dash>0)return;
 if(target.blocking>0)amount*=.25;

 target.hp=Math.max(0,target.hp-Math.round(amount));
 domainEnergy=Math.min(300,domainEnergy+amount*.8);
 ultEnergy=Math.min(300,ultEnergy+amount*.5);

 particles.push({x:target.x,y:target.y,t:.6,text:'-'+Math.round(amount),color:'#ff6378'});

 if(target.hp<=0){
  active=false;
  setTimeout(()=>{
   alert(target===enemy?'🏆 انتصرت في المعركة!':'💀 خسرت المعركة!');
   goMenu();
  },100);
 }
}

function attack(){
 if(!active||player.attackCD>0)return;
 player.attackCD=.35;
 player.face=enemy.x>=player.x?1:-1;

 if(Math.hypot(enemy.x-player.x,enemy.y-player.y)<75){
  damage(enemy,ultTime>0?55:30);
  say('ضربة مباشرة!');
 }
}

function skill(i){
 if(!active||cooldowns[i]>0)return;
 const c=characters[player.key];
 const s=c.skills[i];
 cooldowns[i]=s[2];
 const dist=Math.hypot(enemy.x-player.x,enemy.y-player.y);

 if(i===0){
  damage(enemy,s[1]*(dist<260?1:.5));
  effects.push({x:player.x,y:player.y,color:c.color,r:130,t:.4});
 }else if(i===1){
  if(dist<260)damage(enemy,s[1]);
  effects.push({x:enemy.x,y:enemy.y,color:'#ff526d',r:90,t:.5});
 }else{
  damage(enemy,s[1]);
  effects.push({x:enemy.x,y:enemy.y,color:'#b86bff',r:220,t:.6});
 }
}

function dash(){
 if(!active||dashTime>0)return;
 dashTime=.8;
 player.dash=.22;
 const dx=enemy.x-player.x;
 const dy=enemy.y-player.y;
 const d=Math.hypot(dx,dy)||1;
 player.x-=dx/d*85;
 player.y-=dy/d*85;
 clamp(player);
}

function block(){
 if(!active||blockTime>0)return;
 blockTime=1.2;
 player.blocking=.55;
}

function heal(){
 if(!active||healCooldown>0||player.hp>=player.max)return;
 healCooldown=18;
 player.hp=Math.min(player.max,player.hp+250);
 say('+250 صحة');
}

function domain(){
 if(!active||domainEnergy<300||domainTime>0)return;
 domainEnergy=0;
 domainTime=7;
 say(characters[player.key].domain);
 damage(enemy,120);
 effects.push({x:0,y:0,color:player.color,r:arenaRadius*2,t:1});
}

function ultimate(){
 if(!active||ultEnergy<300||ultTime>0)return;
 ultEnergy=0;
 ultTime=10;
 say('⚡ القدرة القصوى!');
}

function ai(dt){
 if(!active)return;

 const dx=player.x-enemy.x;
 const dy=player.y-enemy.y;
 const d=Math.hypot(dx,dy)||1;

 if(d>90){
  enemy.x+=dx/d*enemy.speed*difficulty*dt*1.5;
  enemy.y+=dy/d*enemy.speed*difficulty*dt*1.5;
 }

 enemy.face=dx>0?1:-1;

 if(d<85&&enemy.attackCD<=0){
  enemy.attackCD=1.1;
  damage(player,25+35*difficulty);
 }

 if(d<250&&Math.random()<difficulty*.025){
  const s=characters[enemy.key].skills[Math.floor(Math.random()*3)];
  damage(player,s[1]*.55);
  effects.push({x:player.x,y:player.y,color:enemy.color,r:100,t:.4});
 }

 if(player.hp<player.max*.35&&enemy.hp>0&&Math.random()<.001){
  enemy.hp=Math.min(enemy.max,enemy.hp+100);
 }
}

function update(dt){
 if(!active)return;

 cooldowns=cooldowns.map(x=>Math.max(0,x-dt));
 player.attackCD=Math.max(0,player.attackCD-dt);
 enemy.attackCD=Math.max(0,enemy.attackCD-dt);
 dashTime=Math.max(0,dashTime-dt);
 blockTime=Math.max(0,blockTime-dt);
 healCooldown=Math.max(0,healCooldown-dt);
 domainTime=Math.max(0,domainTime-dt);
 ultTime=Math.max(0,ultTime-dt);
 player.dash=Math.max(0,player.dash-dt);
 player.blocking=Math.max(0,player.blocking-dt);

 let x=0,y=0;
 if(keys.KeyA||keys.ArrowLeft)x--;
 if(keys.KeyD||keys.ArrowRight)x++;
 if(keys.KeyW||keys.ArrowUp)y--;
 if(keys.KeyS||keys.ArrowDown)y++;

 const l=Math.hypot(x,y)||1;
 if(x||y){
  player.x+=x/l*player.speed*dt;
  player.y+=y/l*player.speed*dt;
  player.face=x!==0?Math.sign(x):player.face;
 }
 clamp(player);

 ai(dt);
 clamp(enemy);

 if(domainTime>0){
  enemy.hp=Math.max(0,enemy.hp-30*dt);
  if(enemy.hp<=0){
   active=false;
   setTimeout(()=>{alert('🏆 انتصرت!');goMenu()},100);
  }
 }

 effects.forEach(e=>e.t-=dt);
 effects=effects.filter(e=>e.t>0);
 particles.forEach(p=>{p.t-=dt;p.y-=25*dt});
 particles=particles.filter(p=>p.t>0);

 document.getElementById('playerfill').style.width=
  (player.hp/player.max*100)+'%';
 document.getElementById('enemyfill').style.width=
  (enemy.hp/enemy.max*100)+'%';

 if(messageTime>0){
  messageTime-=dt;
  if(messageTime<=0)document.getElementById('message').textContent='';
 }
}

function drawFighter(p){
 ctx.save();
 ctx.translate(W/2+p.x,H/2+p.y);
 ctx.strokeStyle=p.color;
 ctx.fillStyle=p.color;
 ctx.lineWidth=5;
 ctx.lineCap='round';
 ctx.shadowColor=p.color;
 ctx.shadowBlur=15;

 ctx.beginPath();
 ctx.ellipse(0,24,15,5,0,0,Math.PI*2);
 ctx.fillStyle='#0008';
 ctx.fill();

 ctx.fillStyle=p.color;
 ctx.beginPath();
 ctx.arc(0,-19,9,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle=p.color;
 ctx.beginPath();
 ctx.moveTo(0,-9);
 ctx.lineTo(0,13);
 ctx.moveTo(0,-4);
 ctx.lineTo(p.face*16,-1);
 ctx.moveTo(0,-4);
 ctx.lineTo(-p.face*10,7);
 ctx.moveTo(0,13);
 ctx.lineTo(-10,29);
 ctx.moveTo(0,13);
 ctx.lineTo(10,29);
 ctx.stroke();

 if(p.blocking>0){
  ctx.strokeStyle='#ffd166';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(0,0,30,0,Math.PI*2);
  ctx.stroke();
 }

 if(p.dash>0){
  ctx.strokeStyle='#fff';
  ctx.beginPath();
  ctx.arc(0,0,36,0,Math.PI*2);
  ctx.stroke();
 }
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 const cx=W/2,cy=H/2;
 const grd=ctx.createRadialGradient(cx,cy,20,cx,cy,arenaRadius);
 grd.addColorStop(0,'#19215d');
 grd.addColorStop(1,'#080d2e');

 ctx.fillStyle=grd;
 ctx.beginPath();
 ctx.arc(cx,cy,arenaRadius,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle='#3949ab';
 ctx.lineWidth=4;
 ctx.stroke();

 ctx.strokeStyle='#ffffff18';
 ctx.lineWidth=1;
 for(let i=1;i<4;i++){
  ctx.beginPath();
  ctx.arc(cx,cy,arenaRadius*i/4,0,Math.PI*2);
  ctx.stroke();
 }

 if(active){
  if(domainTime>0){
   ctx.fillStyle='#9b1c3a30';
   ctx.beginPath();
   ctx.arc(cx,cy,arenaRadius,0,Math.PI*2);
   ctx.fill();
  }

  effects.forEach(e=>{
   ctx.save();
   ctx.globalAlpha=Math.min(1,e.t*2);
   ctx.strokeStyle=e.color;
   ctx.lineWidth=5;
   ctx.beginPath();
   ctx.arc(cx+e.x,cy+e.y,e.r*(1-e.t*.5),0,Math.PI*2);
   ctx.stroke();
   ctx.restore();
  });

  drawFighter(enemy);
  drawFighter(player);

  particles.forEach(p=>{
   ctx.fillStyle=p.color;
   ctx.globalAlpha=Math.min(1,p.t*2);
   ctx.font='bold 20px Arial';
   ctx.textAlign='center';
   ctx.fillText(p.text,cx+p.x,cy+p.y);
   ctx.globalAlpha=1;
  });

  ctx.fillStyle='#fff';
  ctx.font='bold 13px Arial';
  ctx.textAlign='center';
  ctx.fillText(characters[player.key].name,cx+player.x,cy+player.y-48);
  ctx.fillText(characters[enemy.key].name,cx+enemy.x,cy+enemy.y-48);

  ctx.fillStyle='#ffd166';
  ctx.textAlign='center';
  ctx.font='12px Arial';
  ctx.fillText('المجال: '+Math.floor(domainEnergy/3)+'% | الألتميت: '+Math.floor(ultEnergy/3)+'%',W/2,H-100);
 }
}

function loop(t){
 const dt=Math.min((t-last)/1000||0,.033);
 last=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.repeat)return;

 if(e.code==='KeyJ')attack();
 if(e.code==='Digit1')skill(0);
 if(e.code==='Digit2')skill(1);
 if(e.code==='Digit3')skill(2);
 if(e.code==='KeyQ')block();
 if(e.code==='Space'){e.preventDefault();dash()}
 if(e.code==='KeyE')heal();
 if(e.code==='KeyR')domain();
 if(e.code==='KeyU')ultimate();
});

addEventListener('keyup',e=>keys[e.code]=false);

requestAnimationFrame(loop);
</script>
</body>
</html>
